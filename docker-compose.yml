services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/portfolio.db
      - RESUME_PATH=/root/data/resume.json
    volumes:
      - backend-data:/data
    restart: unless-stopped

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: portfolio-agents
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - BACKEND_URL=http://backend:8080
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_FAST=${OPENROUTER_MODEL_FAST:-openai/gpt-4o-mini}
      - OPENROUTER_MODEL_SMART=${OPENROUTER_MODEL_SMART:-anthropic/claude-3.5-sonnet}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-http://localhost:5173}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Hamza & Co. Oracles}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-20}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-3600}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    volumes:
      - agents-cache:/cache
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  agents-cache:
